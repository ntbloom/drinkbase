[tool.poetry]
name = "drinkbase"
version = "0.1.0"
description = "flask/postgres cocktail backend rest API"
authors = ["ntbloom <user@localhost>"]

[tool.poetry.dependencies]
python = "^3.12"
psycopg2-binary = "^2"
Flask = "^3"
requests = "^2"
gunicorn = "^23"
docker = "^7"
six = "^1"

[tool.poetry.dev-dependencies]
black = "^21.5b2"
flake8 = "^3.9.2"
pytest = "^6.2.4"
pytest-cov = "^2.12.1"

[tool.pytest.ini_options]
log_cli_level = "WARN"
log_cli = true
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
